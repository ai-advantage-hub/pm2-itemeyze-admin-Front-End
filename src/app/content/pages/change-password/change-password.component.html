<div class = "container">
    <div class = "contaienr-header">
        <div class = "header-image">
            <img alt="" src = "../../../assets/icons/arrow-back-icon.svg" routerLink="../../profile">
        </div>
        <div class = "header-text">
            <h3>Change Password</h3>
        </div>
    </div>
    <form  [formGroup]="changeForm" class = "user-info">
        <div class = "old-password">
            <img class = "image-1" alt="" src = "../../../assets/icons/lock-icon.svg">
            <input type = "{{ showOldPassword ? 'text' : 'password' }}"  formControlName="old_password" placeholder = "Old Password" style="padding-right: 60px;" required />
            <span *ngIf="changeForm.get('old_password').errors?.required && changeForm.get('old_password').touched"
            class="val-error">Please enter your old password</span>
            <img *ngIf="changeForm.get('old_password').errors?.required && changeForm.get('old_password').touched" class="val-image" alt="" src="../../../assets/icons/validation-triangle.svg">
            <!-- <span *ngIf="((changeForm.get('old_password').hasError('minLength'))|| (changeForm.get('old_password').hasError('maxLength')) )&& changeForm.get('old_password').touched"
            class="val-error">Password must have 8-15 characters </span>
            <img *ngIf="((changeForm.get('old_password').hasError('minLength'))|| (changeForm.get('old_password').hasError('maxLength')) )  && changeForm.get('old_password').touched" class="val-image" alt="" src="../../../../assets/icons/validation-triangle.svg"> -->
            <img class = "image-2" *ngIf="!showOldPassword" alt="" src = "../../../assets/icons/show-password-eye-icon.svg" (click)="toggleOldPasswordVisibility()">
            <img class = "image-3" *ngIf="showOldPassword" alt="" src = "../../../assets/icons/hide-password-eye-icon.svg" (click)="toggleOldPasswordVisibility()">
        </div>
        <div class = "new-password">
            <img class = "image-1" alt="" src = "../../../assets/icons/lock-icon.svg">
            <input type = "{{ showNewPassword ? 'text' : 'password' }}" formControlName="new_password"  placeholder = "New Password" style="padding-right: 60px;" required />
            <span *ngIf="changeForm.get('new_password').errors?.required && changeForm.get('new_password').touched"
            class="val-error">Please enter your new password</span>
            <img *ngIf="changeForm.get('new_password').errors?.required && changeForm.get('new_password').touched" class="val-image" alt="" src="../../../assets/icons/validation-triangle.svg">
            <span *ngIf="((changeForm.get('new_password').hasError('minLength'))|| (changeForm.get('new_password').hasError('maxLength')) || (changeForm.get('new_password').hasError('pattern')) )&& changeForm.get('new_password').touched"
            class="val-error">Password must have 8-15 characters comprising one caps, one small, one number and one
            special character. </span>
            <img *ngIf="((changeForm.get('new_password').hasError('minLength'))|| (changeForm.get('new_password').hasError('maxLength')) || (changeForm.get('new_password').hasError('pattern')) ) && changeForm.get('new_password').touched" class="val-image" alt="" src="../../../../assets/icons/validation-triangle.svg">
            <img class = "image-2" *ngIf="!showNewPassword" alt="" src = "../../../assets/icons/show-password-eye-icon.svg" (click)="toggleNewPasswordVisibility()">
            <img class = "image-3" *ngIf="showNewPassword" alt="" src = "../../../assets/icons/hide-password-eye-icon.svg" (click)="toggleNewPasswordVisibility()">
        </div>
        <div class = "confirm-password">
            <img class = "image-1" alt="" src = "../../../assets/icons/lock-icon.svg">
            <input type = "{{ showConfirmPassword ? 'text' : 'password' }}" formControlName="confirm_password" placeholder = "Confirm Password" style="padding-right: 60px;" required />
            <span *ngIf="changeForm.get('confirm_password').errors?.required && changeForm.get('confirm_password').touched"
            class="val-error">Please confirm password</span>
            <img *ngIf="changeForm.get('confirm_password').errors?.required && changeForm.get('confirm_password').touched" class="val-image" alt="" src="../../../assets/icons/validation-triangle.svg">
            <span *ngIf="changeForm.hasError('notSame')" class="val-error">
              Passwords do not match
            </span> 
            <span *ngIf="((changeForm.get('confirm_password').hasError('minLength')) || (changeForm.get('confirm_password').hasError('maxLength')) )&& changeForm.get('confirm_password').touched"
            class="val-error">Password must have 8-15 characters </span>
            <img *ngIf="((changeForm.get('confirm_password').hasError('minLength')) || (changeForm.get('new_password').hasError('maxLength')) ) && changeForm.get('confirm_password').touched" class="val-image" alt="" src="../../../../assets/icons/validation-triangle.svg">
            <img class = "image-2" *ngIf="!showConfirmPassword" alt="" src = "../../../assets/icons/show-password-eye-icon.svg" (click)="toggleConfirmPasswordVisibility()">
            <img class = "image-3" *ngIf="showConfirmPassword" alt="" src = "../../../assets/icons/hide-password-eye-icon.svg" (click)="toggleConfirmPasswordVisibility()">
        </div>
    </form>
    <div class="save-button">
        <button  class="btn btn-primary" (click)="changePassword()" [disabled]="!changeForm.valid">Save Password</button>
    </div>
</div>
