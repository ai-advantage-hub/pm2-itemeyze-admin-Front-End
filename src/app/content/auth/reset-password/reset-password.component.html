<div class="container">
  <div class="row-1">
    <div class="col-logo">
      <div class="logo-img">
        <img alt="" src="../../assets/logos/pm2logo.svg" />
      </div>
      <div class="logo-text">
        <img alt="" src="../../assets/logos/logotext.svg" />
      </div>
    </div>
    <div class="rp-form">
      <div class="form-heading">
        <h1 class="rp-text">
          <i class="fa fa-arrow-left" aria-hidden="true" routerLink="/auth/login"></i>
          Reset Password
        </h1>
      </div>
      <div class="para">
        <p>Reset your password to sign in again.</p>
      </div>
      <form [formGroup]="resetForm" class="form-fields">
        <div class = "new-password-field" style="position: relative;">
          <img class = "lock-icon" alt="" src = "../../../assets/icons/lock-icon.svg">
          <input type = "{{ showNewPassword ? 'text' : 'password' }}" formControlName="password"  placeholder = "Enter New Password" required />
          <span *ngIf="resetForm.get('password').errors?.required && resetForm.get('password').touched"
          class="val-error">Please enter your new password</span>
          <img *ngIf="resetForm.get('password').errors?.required && resetForm.get('password').touched" class="val-image" alt="" src="../../../assets/icons/validation-triangle.svg">
          <span *ngIf="((resetForm.get('password').hasError('minLength'))|| (resetForm.get('password').hasError('maxLength')) || (resetForm.get('password').hasError('pattern')) )&& resetForm.get('password').touched"
          class="val-error">Password must have 8-15 characters comprising one caps, one small, one number and one
          special character. </span>
          <img *ngIf="((resetForm.get('password').hasError('minLength'))|| (resetForm.get('password').hasError('maxLength')) || (resetForm.get('password').hasError('pattern')) ) && resetForm.get('password').touched" class="val-image" alt="" src="../../../../assets/icons/validation-triangle.svg">
          <img class = "password-icon" *ngIf="!showNewPassword" alt="" src = "../../../assets/icons/show-password-eye-icon.svg" (click)="toggleNewPasswordVisibility()">
          <img class = "password-icon" *ngIf="showNewPassword" alt="" src = "../../../assets/icons/hide-password-eye-icon.svg" (click)="toggleNewPasswordVisibility()">
      </div>
      <div class = "confirm-password-field" style="position: relative;">
          <img class = "lock-icon" alt="" src = "../../../assets/icons/lock-icon.svg">
          <input type = "{{ showConfirmPassword ? 'text' : 'password' }}" formControlName="confirm_password" placeholder = "Confirm Password" required />
          <span *ngIf="resetForm.get('confirm_password').hasError('required') && resetForm.get('confirm_password').touched"
          class="val-error">Please confirm password</span>
          <img *ngIf="resetForm.get('confirm_password').hasError('required') && resetForm.get('confirm_password').touched" class="val-image" alt="" src="../../../assets/icons/validation-triangle.svg">
          <span *ngIf="resetForm.hasError('notSame')" class="val-error">
            Passwords do not match
          </span> 
          <img class = "password-icon" *ngIf="!showConfirmPassword" alt="" src = "../../../assets/icons/show-password-eye-icon.svg" (click)="toggleConfirmPasswordVisibility()">
          <img class = "password-icon" *ngIf="showConfirmPassword" alt="" src = "../../../assets/icons/hide-password-eye-icon.svg" (click)="toggleConfirmPasswordVisibility()">
      </div>
        <div class="save-password-btn">
          <button type="submit" class="button" [disabled]="!resetForm.valid" (click) = "changePassword()">Save Password</button>
        </div>
      </form>
    </div>
  </div>
  <div class="row-2">
    <div class="img-onb">
      <img alt="" src="../../assets/images/maskgroup.svg" />
    </div>
  </div>
</div>
