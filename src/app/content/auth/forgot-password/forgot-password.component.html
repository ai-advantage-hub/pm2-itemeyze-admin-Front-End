<div class="container">
  <div class="row-1">
    <div class="col-logo">
      <div class="logo-img">
        <img alt="" src="../../assets/logos/pm2logo.svg" />
      </div>
      <div class="logo-text">
        <img alt="" src="../../assets/logos/logotext.svg" />
      </div>
    </div>
    <div class="fp-form">
      <div class="form-heading">
        <h1 class="fp-text">
          <i class="fa fa-arrow-left" aria-hidden="true" routerLink="/auth/login"></i>
          Forgot Password
        </h1>
      </div>
      <div class="para">
        <p>
          Please provide your email and a verification link will be sent to your
          email address.
        </p>
      </div>
      <form [formGroup]="forgetForm" class="form-fields">
        <div class="email-field">
          <img class = "email-icon" alt = "" src = "../../../../assets/icons/mailicon.svg">
          <input type = "text" formControlName="email" placeholder = "Email Address" required />
          <span *ngIf="forgetForm.get('email').hasError('pattern') && forgetForm.get('email').touched"
          class="val-error">Please enter valid email address</span>
          <img *ngIf="forgetForm.get('email').hasError('pattern') && forgetForm.get('email').touched" class="val-image" alt="" src="../../../../assets/icons/validation-triangle.svg">
          <span *ngIf="forgetForm.get('email').errors?.required && forgetForm.get('email').touched"
          class="val-error">Please enter your email address</span>
          <img *ngIf="forgetForm.get('email').errors?.required && forgetForm.get('email').touched" class="val-image" alt="" src="../../../../assets/icons/validation-triangle.svg">
        </div>
        <div class="send-link-btn">
          <button type="submit" class="button" [disabled]="!forgetForm.valid" (click)="forgetPassword()">Send Link</button>
        </div>
      </form>
    </div>
  </div>
  <div class="row-2">
    <div class="img-onb">
      <img alt="" src="../../assets/images/maskgroup.svg" />
    </div>
  </div>
</div>
