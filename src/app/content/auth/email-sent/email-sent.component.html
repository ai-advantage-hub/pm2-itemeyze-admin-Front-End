<div class="container">
  <div class="row-1">
    <div class="col-logo">
      <div class="logo-img">
        <img alt="" src="../../assets/logos/pm2logo.svg" />
      </div>
      <div class="logo-text">
        <img alt="" src="../../assets/logos/logotext.svg" />
      </div>
    </div>
    <div class="se-form">
      <div class="form-logo">
        <img alt="" src="../../assets/icons/emailsenticon.svg" />
      </div>
      <div class="form-heading">
        <h1 class="se-text">Email sent</h1>
      </div>
      <div class="para">
        <p>
          Verification link was successfully sent on your registered email
          address.
        </p>
      </div>
      <div class="back-ln-btn">
        <a [routerLink]="['/auth/login']">
          <button class="button">Back To Login</button>
        </a>
      </div>
    </div>
  </div>
  <div class="row-2">
    <div class="img-onb">
      <img alt="" src="../../assets/images/maskgroup.svg" />
    </div>
  </div>
</div>
